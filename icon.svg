<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fed"/>
      <stop offset="1" stop-color="#7aa2ff"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b7a62"/>
      <stop offset="1" stop-color="#1c5a47"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d79a4a"/>
      <stop offset="1" stop-color="#a9691f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- soft shadow -->
  <ellipse cx="256" cy="392" rx="170" ry="14" fill="#10285f" opacity=".22"/>
  <!-- wooden frame -->
  <rect x="88" y="124" width="336" height="236" rx="20" fill="url(#wood)"/>
  <!-- chalkboard -->
  <rect x="106" y="142" width="300" height="200" rx="10" fill="url(#board)"/>
  <rect x="106" y="142" width="300" height="200" rx="10" fill="none" stroke="#14463a" stroke-width="3"/>
  <!-- chalk check mark -->
  <path d="M146 246 L182 282 L246 208" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- chalk lines (text) -->
  <g stroke="#fff" stroke-linecap="round" fill="none">
    <path d="M280 202 H376" stroke-width="11" opacity=".92"/>
    <path d="M280 244 H360" stroke-width="11" opacity=".78"/>
    <path d="M280 286 H340" stroke-width="11" opacity=".62"/>
  </g>
  <!-- small chalk doodles -->
  <path d="M136 312 q12 -14 24 0 t24 0" fill="none" stroke="#ffd966" stroke-width="6" stroke-linecap="round" opacity=".9"/>
  <!-- chalk tray -->
  <rect x="82" y="352" width="348" height="20" rx="8" fill="#8a5517"/>
  <rect x="82" y="352" width="348" height="6" rx="3" fill="#c98a3b"/>
  <!-- chalk pieces + eraser -->
  <rect x="150" y="340" width="34" height="12" rx="5" fill="#fff"/>
  <rect x="192" y="342" width="26" height="10" rx="4" fill="#ffd966"/>
  <rect x="330" y="334" width="62" height="18" rx="5" fill="#e8e1d6"/>
  <rect x="330" y="344" width="62" height="8" rx="4" fill="#3d3d4a"/>
</svg>
