<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدیریت کلاس</title>
<meta name="description" content="برنامه مدیریت کلاس: مدرسه، کلاس‌ها، دانش‌آموزان، حضور و غیاب، نمرات و کارنامه">
<meta name="theme-color" content="#2f6fed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مدیریت کلاس">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" sizes="any" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--c:#2f6fed;--c2:#7aa2ff;--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#667;--pr:#2f6fed;--bd:#dde1ea;--ok:#1b9c5a;--no:#d6403a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#1a2030;--tx:#e8ecf5;--mu:#97a0b5;--pr:#6b9bff;--bd:#2c3448}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 Vazirmatn,Tahoma,sans-serif}
header{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
header small{opacity:.9}
#app{display:grid;grid-template-columns:minmax(0,1fr);align-items:start}header{grid-column:1/-1;padding-right:66px}
nav{display:flex;flex-direction:column;gap:6px;padding:68px 10px 20px;background:var(--card);border-left:1px solid var(--bd);position:fixed;top:0;right:0;bottom:0;width:min(290px,84vw);z-index:60;overflow-y:auto;box-shadow:-8px 0 28px #0005;transform:translateX(110%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
nav.open{transform:none;visibility:visible;transition:transform .25s ease}
.mback{position:fixed;inset:0;background:#0006;z-index:55;display:none}.mback.open{display:block}
.hbg{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:70;width:46px;height:46px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--c);box-shadow:0 2px 10px #0004;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:0;cursor:pointer}
.hbg i{display:block;width:22px;height:3px;border-radius:2px;background:currentColor}
.mcl{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--bg)}.mcl input{width:100%;margin:4px 0}
.msep{border:0;border-top:1px solid var(--bd);margin:6px 0;width:100%}
nav button{width:100%;text-align:right;border:2px solid var(--c);background:none;color:var(--tx);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;box-shadow:0 3px 10px #0003}
main{padding:12px;min-width:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px;border-top:4px solid var(--c);box-shadow:0 2px 8px #0001}
h3{margin:0 0 8px;color:var(--c)}
input,select,button.b{font:inherit;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:2px}
button.b{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;border:0;cursor:pointer}button.d{background:var(--no)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--bd);padding:5px 8px;text-align:center;font-size:14px}th{background:var(--c);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-width:340px}
.cal div{text-align:center;padding:6px 0;border-radius:8px;font-size:13px}
.cal .dd{cursor:pointer;border:1px solid var(--bd)}.cal .dd.on{background:var(--c);color:#fff}.cal .dd.fr{color:var(--no)}
.mu{color:var(--mu)}
#login{max-width:420px;margin:8vh auto;grid-column:1/-1;width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}.kp{border-radius:12px;padding:10px;color:#fff;text-align:center;box-shadow:0 3px 10px #0002}.kp b{display:block;font-size:22px}.kp span{font-size:13px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.charts svg{width:100%;height:auto}.charts text{fill:var(--tx);font-size:10px}.pb{height:8px;border-radius:4px;background:var(--c);display:inline-block;vertical-align:middle}
@media print{@page{size:A4;margin:12mm}#app{display:block}header,nav,.hbg,.mback,.np,.mu-print-hide{display:none!important}body{background:#fff!important;color:#000!important;font-size:11pt}.card{box-shadow:none;break-inside:avoid;border:0;padding:4px;margin:0 0 8px}th{background:#ddd!important;color:#000!important}table{font-size:10pt}th,td{padding:4px}}
</style>

 h+='<div class="card"><h3>متن پیام</h3><div class="row"><span class="mu">درج در متن:</span><button class="b" onclick="smsIns(\'{نام}\')">نام</button><button class="b" onclick="smsIns(\'{نام_خانوادگی}\')">نام خانوادگی</button><button class="b" onclick="smsIns(\'{مدرسه}\')">مدرسه</button></div><textarea id="smt" rows="4" style="width:100%;font:inherit;margin-top:6px;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)" placeholder="مثال: اولیای محترم {نام} {نام_خانوادگی}، با سلام..." oninput="smsSetT(this.value)">'+esc(t)+'</textarea><div id="smc" class="mu"></div>';

function attDays(r,n){var ds=Object.keys(r.day).sort().slice(-n),W=Math.max(320,ds.length*26+30),H=170,mx=1;

 var cs=Object.keys(r.cls).map(function(k){return r.cls[k]}).sort(function(a,b){return(a.c.grade+a.c.sec).localeCompare(b.c.grade+b.c.sec,'fa')});

 h+='<div class="card sc"><h3>همهٔ دانش‌آموزان (بیشترین غیبت در بالا)</h3><table><tr><th>#</th><th>نام و نام خانوادگی</th><th>پایه</th><th>حاضر</th><th>غایب</th><th>تأخیر</th><th>مرخصی</th><th>درصد حضور</th><th>نمودار</th><th></th></tr>'+sl.map(function(x,i){var u=x.u;return'<tr><td>'+fa(i+1)+'</td><td style="text-align:right">'+sname(x.s)+'</td><td>'+fa(esc(x.s.grade))+'</td><td>'+fa(u.p)+'</td><td>'+fa(u.a)+'</td><td>'+fa(u.l)+'</td><td>'+fa(u.e)+'</td><td>'+pct(u.p,u.tot)+'</td><td style="min-width:90px;text-align:right">'+attBars('حاضر',u.p,u.tot,CC.p)+attBars('غایب',u.a,u.tot,CC.a)+attBars('تأخیر',u.l,u.tot,CC.l)+attBars('مرخصی',u.e,u.tot,CC.e)+'</td><td><button class="b" onclick="S.rs=\''+x.id+'\';sv(\'rv\',\'stu\')">👤 مشاهده</button></td></tr>'}).join('')+'</table></div>';

 absD=ds.filter(function(d){return Object.keys(u.days[d]).some(function(p){return u.days[d][p]=='a'})}).length,
 h='<div class="card np"><div class="row"><b>دانش‌آموز:</b><select onchange="S.rs=this.value;R()">'+L.map(function(x){return'<option value="'+x.id+'" '+(x.id==S.rs?'selected':'')+'>'+esc(x.ln+' '+x.fn)+' — پایه '+esc(x.grade)+'</option>'}).join('')+'</select></div></div>';

 h+=attKpis({p:u.p,a:u.a,l:u.l,e:u.e},u.tot,'<div class="kp" style="background:#ad1457"><b>'+fa(absD)+'</b><span>روز دارای غیبت</span></div><div class="kp" style="background:#00695c"><b>'+fa(ds.length)+'</b><span>روز ثبت‌شده</span></div>')+attStack(u,u.tot)+'</div>';
 var ms={};ds.forEach(function(d){var mk=d.slice(0,7),o=ms[mk]=ms[mk]||{p:0,a:0,l:0,e:0,tot:0};for(var p in u.days[d]){o[u.days[d][p]]++;o.tot++}});
 h+='<div class="card sc"><h3>روند ماهانه</h3><table><tr><th>ماه</th><th>حاضر</th><th>غایب</th><th>تأخیر</th><th>مرخصی</th><th>درصد حضور</th><th>نمودار</th></tr>'+Object.keys(ms).sort().map(function(k){var o=ms[k];return'<tr><td>'+monthLabel(k)+'</td><td>'+fa(o.p)+'</td><td>'+fa(o.a)+'</td><td>'+fa(o.l)+'</td><td>'+fa(o.e)+'</td><td>'+pct(o.p,o.tot)+'</td><td style="min-width:90px;text-align:right">'+attBars('حاضر',o.p,o.tot,CC.p)+attBars('غایب',o.a,o.tot,CC.a)+attBars('تأخیر',o.l,o.tot,CC.l)+attBars('مرخصی',o.e,o.tot,CC.e)+'</td></tr>'}).join('')+'</table></div>';
 var show=S.rall?ds:ds.filter(function(d){return Object.keys(u.days[d]).some(function(p){return u.days[d][p]!='p'})});
 h+='<div class="card sc"><h3>روزها و تاریخ‌ها</h3><div class="row np"><button class="b" onclick="S.rall=!S.rall;R()">'+(S.rall?'فقط روزهای غیبت/تأخیر/مرخصی':'نمایش همهٔ روزها')+'</button></div>'+(show.length?'<table><tr><th>تاریخ</th><th>روز</th><th>وضعیت زنگ‌ها</th></tr>'+show.map(function(d){var q=d.split('/').map(Number);return'<tr><td>'+fa(d)+'</td><td>'+WD[wday(q[0],q[1],q[2])]+'</td><td style="text-align:right">'+Object.keys(u.days[d]).sort(function(a,b){return a-b}).map(function(p){var st=u.days[d][p];return'<span style="display:inline-block;background:'+CC[st]+';color:#fff;border-radius:8px;padding:0 8px;margin:2px;font-size:13px">زنگ '+fa(p)+': '+SL[st]+'</span>'}).join('')+'</td></tr>'}).join('')+'</table>':'<span class="mu">این دانش‌آموز در این بازه غیبت، تأخیر یا مرخصی نداشته است.</span>')+'</div>';
 return h}
